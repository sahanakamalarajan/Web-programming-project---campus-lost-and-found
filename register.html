<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
}

.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin: 0 0 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.login-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.login-form input,
.login-form select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    background: white;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: block;
    position: relative;
    z-index: 10;
}

.login-btn:hover {
    background: #1d4ed8;
}

.message {
    text-align: center;
    min-height: 20px;
    margin: 0;
}

.login-form p {
    text-align: center;
}

.login-form a {
    color: #2563eb;
    text-decoration: none;
}

.login-form a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Create your Campus Lost & Found account
        </p>

        <div class="login-form">

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Student Email"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >

            <input
                type="tel"
                id="registerPhone"
                placeholder="Phone Number"
            >

            <select id="registerDepartment">
                <option value="">Select Department</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics">Electronics</option>
                <option value="Electrical">Electrical</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Cyber Security">Cyber Security</option>
                <option value="Other">Other</option>
            </select>

            <button
                type="button"
                id="registerButton"
                class="login-btn"
            >
                Register
            </button>

            <p id="registerMessage" class="message"></p>

            <p>
                Already have an account?
                <a href="index.html">Login here</a>
            </p>

        </div>

    </div>

</div>

<script>
const button = document.getElementById("registerButton");

button.addEventListener("click", async function() {

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value.trim();
    const phone = document.getElementById("registerPhone").value.trim();
    const department = document.getElementById("registerDepartment").value;
    const message = document.getElementById("registerMessage");

    if (!name || !email || !password || !phone || !department) {
        message.textContent = "Please fill all fields.";
        message.style.color = "red";
        return;
    }

    message.textContent = "Registering...";
    message.style.color = "blue";

    try {

        const response = await fetch("http://localhost:3000/api/student/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                phone: phone,
                department: department
            })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.message || "Registration failed.";
            message.style.color = "red";
            return;
        }

        message.textContent = "Registration successful!";
        message.style.color = "green";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1500);

    } catch (error) {

        message.textContent = "Cannot connect to backend server.";
        message.style.color = "red";

    }

});
</script>

</body>
</html>
